# Render Blueprint: the hosted API behind the Cloudflare gateway (docs/cloudflare-deploy.md).
# Free plan only. Render prompts once for OPENROUTER_API_KEY (sync: false) and generates
# GATEWAY_TOKEN; copy that value into the gateway's API_TOKEN secret for the same environment.
# The API trusts its onrender.com Host (RENDER_EXTERNAL_HOSTNAME) only while GATEWAY_TOKEN is set.
services:
  - type: web
    name: accord-api-staging
    runtime: docker
    plan: free
    branch: develop
    autoDeployTrigger: checksPass
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    buildFilter:
      paths: ["api/**"]
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GATEWAY_TOKEN
        generateValue: true

  - type: web
    name: accord-api-production
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    buildFilter:
      paths: ["api/**"]
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GATEWAY_TOKEN
        generateValue: true
