# Four required checks: web, api, e2e, docker. No secrets, no AI provider calls, no deploys.
# Fork and Dependabot PRs run exactly the same jobs with a read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # LayoutProps/PageProps are generated into .next/types, which a fresh checkout lacks
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.18
          enable-cache: true # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The config's webServer builds and serves the app; tests stub every /api/* call.
      - run: pnpm e2e --reporter=list,html --trace=retain-on-failure
      # The Cloudflare static export (out/) on a plain static server: no API, so no stubs.
      - run: pnpm e2e:static --reporter=list,html --trace=retain-on-failure
      # Synthetic fixtures only (fixtures/inventory), so traces hold no real inventory data.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No api/.env exists here: compose marks it optional, so inference reports NOT_CONFIGURED.
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: scripts/docker-smoke.sh
      - if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Mode A static site to the existing Direct Upload Pages project. Pushes to develop/main only, after
  # all four checks pass on this exact commit; PRs, forks, release/** and workflow_dispatch never get here.
  deploy-web:
    name: deploy-web
    needs: [web, api, e2e, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false # a deploy must not restore a cache a PR run could have written
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      # The static bundle must never carry provider credentials or the local API origin.
      - run: "! grep -rlE 'OPENROUTER|sk-or-|api_key|127.0.0.1:8000' out/"
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          pnpm exec wrangler pages deploy out --project-name accord-web \
            --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=false
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .url' "$WRANGLER_OUTPUT_FILE_PATH")
          id=$(jq -r 'select(.type == "pages-deploy-detailed") | .deployment_id' "$WRANGLER_OUTPUT_FILE_PATH")
          test -n "$url" && test "$url" != null
          # Pages must agree that main is production and develop is a preview; anything else is misconfiguration.
          env=$(jq -r 'select(.type == "pages-deploy-detailed") | .environment' "$WRANGLER_OUTPUT_FILE_PATH")
          test "$env" = "$([ "$GITHUB_REF_NAME" = main ] && echo production || echo preview)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $GITHUB_REF_NAME: $url (deployment $id)" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec playwright install --with-deps chromium
      # The same static e2e suite, against this exact deployment rather than a local server.
      - env:
          ACCORD_E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm e2e:static
