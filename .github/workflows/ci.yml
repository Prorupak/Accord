# Four required checks: web, api, e2e, docker. No secrets, no AI provider calls, no deploys.
# Databases are throwaway service containers with throwaway passwords; nothing reaches a hosted DB.
# Fork and Dependabot PRs run exactly the same jobs with a read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    # Disposable PostgreSQL for `pnpm test:db` only; the job's other steps run with no DATABASE_URL.
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: accord_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d accord_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The Prisma client is generated (gitignored) and imported by src/server; needs no database.
      - run: pnpm generate
      # LayoutProps/PageProps are generated into .next/types, which a fresh checkout lacks
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Fresh + repeated migrate deploy, drift check and constraint tests on a scratch database.
      - run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:ci-disposable@127.0.0.1:5432/accord_test

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.18
          enable-cache: true # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm # zizmor: ignore[cache-poisoning] CI publishes nothing; caches only speed up installs
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The config's webServer builds and serves the app; tests stub every /api/* call.
      - run: pnpm e2e --reporter=list,html --trace=retain-on-failure
      # Synthetic fixtures only (fixtures/inventory), so traces hold no real inventory data.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No api/.env exists here: compose marks it optional, so inference reports NOT_CONFIGURED.
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: scripts/docker-smoke.sh
      # Guest mode with DATABASE_URL configured but PostgreSQL never started (db is not a dependency).
      - run: |
          docker compose -f compose.yaml -f compose.db.yaml up -d --wait --wait-timeout 120 web
          scripts/docker-smoke.sh
        env:
          POSTGRES_PASSWORD: ci-disposable
      # Own Compose project and volume: migrate, restart persistence, re-migrate, dump/restore.
      - run: scripts/docker-db-check.sh
      - if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      # CI-only: this runner's volumes are disposable. Never the default for local cleanup.
      - if: always()
        run: docker compose down --volumes
