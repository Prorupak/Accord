# Opt-in PostgreSQL for account features (Phase 05-I/B: schema and migrations only; nothing in the
# app reads or writes it yet). Guest mode is `docker compose up` without this file. See docs/docker.md.
#   docker compose -f compose.yaml -f compose.db.yaml up -d --build db
#   docker compose -f compose.yaml -f compose.db.yaml run --rm migrate
#   docker compose -f compose.yaml -f compose.db.yaml up -d --build
# POSTGRES_PASSWORD comes from the root .env (see .env.example); it is never baked into an image.
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: accord
      POSTGRES_DB: accord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # PostgreSQL 18 keeps PGDATA under /var/lib/postgresql/18/docker, so mount the parent.
    volumes: [accord-db:/var/lib/postgresql]
    # Private network only: never publish 5432. Use `docker compose exec db psql -U accord accord`.
    expose: ["5432"]
    # Not read_only: the server writes its data volume. Capabilities: the minimum the entrypoint needs to start and restart (tested).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    restart: unless-stopped
    networks: [accord]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "accord", "-d", "accord"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: migrate
    image: accord-migrate:local
    environment:
      DATABASE_URL: postgresql://accord:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/accord
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    networks: [accord]
    depends_on:
      db:
        condition: service_healthy
    # Only runs when asked (`run --rm migrate`); `up` never migrates implicitly.
    profiles: [migrate]

  web:
    # Runtime only; no code path uses it until Phase 05-I/C. The api service gets nothing here.
    environment:
      DATABASE_URL: postgresql://accord:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/accord

volumes:
  accord-db: {}
